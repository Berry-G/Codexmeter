[meter]
; Sizes/offsets are logical pixels at 96 DPI, automatically scaled per monitor.
; Compact title-bar strip, immediately left of the minimize button.
max_width=280
; Hide if this minimum safe width does not fit. Height is fixed at 24 logical px.
min_width=180
button_gap=8
; Keep the left title-bar navigation/menu area unobscured.
titlebar_left_reserved=360
; Codex custom title bar: used only if Windows reports no native caption buttons.
custom_button_width=46
custom_titlebar_height=36
; auto follows the Codex title bar. Optional light/dark override.
theme=auto
; Fetch only while Codex is foreground. Minimum 60 seconds.
refresh_seconds=60
; Exact quota bucket. Never combine unrelated model limits.
bucket=codex
; Blank = discover the CLI installed with Codex.
codex_path=
; Blank = detect official OpenAI.Codex / OpenAI\Codex desktop executable.
; Optional absolute path for portable installs. Window titles are never matched.
target_exe=
